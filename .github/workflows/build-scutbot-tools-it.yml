name: Build SCUTBOT IT Tools Image

on:
  push:
    branches:
      - chore/all-my-stuffs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: scutbot-tools-it-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/it-tools
          tags: |
            type=raw,value=tools-it
            type=raw,value=tools-it-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_URL=/tools/it/
            VITE_AVAILABLE_LOCALES=en,zh
            VITE_LANGUAGE=zh
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=scutbot-tools-it
          cache-to: type=gha,mode=max,scope=scutbot-tools-it
